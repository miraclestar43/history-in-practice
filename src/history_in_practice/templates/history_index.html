<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>没事儿多读书</title>
<style>
:root{--bg:#faf8f4;--fg:#24221f;--muted:#6f6a62;--line:#e3ddd2;--accent:#7a5c3e;--card:#fff;--note:#f3eee6;--fs:18px}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--fg:#e9e5de;--muted:#a39d93;--line:#34312c;--accent:#d2a679;--card:#1f1d1a;--note:#29261f}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.85 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
header.site{border-bottom:1px solid var(--line);padding:10px 20px;font-size:14px;display:flex;gap:16px;align-items:center}
header.site a{color:var(--muted);text-decoration:none}
main{max-width:680px;margin:0 auto;padding:20px 20px 80px}
html[lang=en] main{max-width:660px}
html[lang=en] body{line-height:1.7}
html[lang=en] article section p{hyphens:auto;-webkit-hyphens:auto}
article p{margin:0 0 1.05em;text-wrap:pretty;overflow-wrap:break-word}
h1{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:28px;line-height:1.3;margin:.25em 0 .35em;text-wrap:balance;overflow-wrap:break-word}
h2{font-size:20px;line-height:1.45;color:var(--accent);margin:2em 0 .6em;letter-spacing:.02em}
@media (min-width:760px){body{--fs:18.5px} h1{font-size:34px} h2{font-size:22px} main{padding-top:32px}}
article{font-size:calc(var(--fs) * var(--scale,1))}
.meta{color:var(--muted);font-size:14px;line-height:1.6}
.dek{color:var(--muted);font-size:1.02em;line-height:1.75;margin:0 0 .4em}
.modern{background:var(--note);padding:10px 14px;border-radius:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 8px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.tabs{display:flex;gap:6px}
.tabs button,.fsz button{font:inherit;font-size:15px;min-height:36px;padding:4px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
.fsz{display:flex;gap:6px;align-items:center;margin-left:auto;color:var(--muted)}
.fsz button{padding:4px 12px;min-width:44px}
.fsz button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.tabs button:focus-visible,.fsz button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc{border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:14px 0 4px;font-size:15px}
.toc summary{color:var(--muted)}
.toc ol{margin:6px 0 4px;padding-left:1.3em;line-height:1.8}
.toc a{text-decoration:none}
.question{font-weight:600;border-left:3px solid var(--accent);padding-left:12px}
details{border-top:1px dashed var(--line);margin-top:22px;padding-top:10px}
details.toc{border-top:1px solid var(--line)}
summary{cursor:pointer;color:var(--accent);min-height:32px}
.small{font-size:14px;color:var(--muted);line-height:1.7}
.notes h3{font-size:15px;color:var(--muted);margin:1.2em 0 .3em}
.notes p,ol.src,ul.more{font-size:15px;color:var(--muted);line-height:1.75}
ol.src,ul.more{padding-left:1.3em}
a{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.filters button{font:inherit;font-size:14px;padding:2px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;cursor:pointer}
.filters button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item a{font-size:1.1rem;text-decoration:none}
.error{border:1px solid #b55;padding:12px;border-radius:6px}
.corr{border:2px solid #2f5b8a;color:#1f3d5c;padding:8px 12px;border-radius:6px;font-size:15px;margin:10px 0;line-height:1.7}
@media (prefers-color-scheme:dark){.corr{color:#a9c8ea;border-color:#5b87b8}}
.test{border:2px solid #b5542f;color:#b5542f;padding:8px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.sample{border-left:3px solid var(--accent);background:var(--note);padding:6px 12px;border-radius:4px;font-size:14px;margin:8px 0;color:var(--fg)}
.pending{border:2px solid #9a6b00;color:#7a5400;background:#fff8e6;padding:8px 12px;border-radius:6px;font-size:14px;margin:10px 0;line-height:1.7}
@media (prefers-color-scheme:dark){.pending{background:#2b2410;color:#e0b85c;border-color:#c99a2e}}
.langs{font-size:14px;margin:-4px 0 6px}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.search{display:flex;gap:8px;margin:14px 0 6px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search .clear{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="site"><a href="/">StarHub</a><a href="./">没事儿多读书</a></header>
<main id="app" aria-live="polite"><p class="small">加载中…</p></main>
<script>
"use strict";
const CAT = {china_ancient:["中国古代","Ancient China"],world:["世界史","World History"],china_modern:["中国近现代","Modern China"],us:["美国史","U.S. History"]};
const T = {zh:{q:"想一想",ex:"一个参考思路",as:"假设",st:"可以怎么做",alt:"另一种合理选择",unc:"出处与不确定性",src:"本篇依据",more:"想再读一点",notes:"书目与补充说明",toc:"目录",fs:"字号",min:"分钟",all:"全部",back:"← 全部文章",stop:"先停十秒，想想你会怎么做。"},
           en:{q:"Think about it",ex:"One possible approach",as:"Assumptions",st:"What you could do",alt:"Another reasonable choice",unc:"Sources and uncertainty",src:"Sources",more:"Read more",notes:"Sources and notes",toc:"Contents",fs:"Text size",min:"min",all:"All",back:"← All stories",stop:"Pause for ten seconds and decide what you would do."}};
const BRAND = {zh:"没事儿多读书",en:"没事儿多读书"};
const SCALES = [0.9, 1, 1.12, 1.25];
let scale = Math.min(SCALES.length-1, Math.max(0, parseInt(localStorage.getItem("hip-fs") ?? "1", 10) || 1));
const TEST = {zh:"测试页面：用于检查排版与链接，不是正式发布的一期；每日订阅尚未开始。",en:"TEST page: for checking layout and links. Not an official edition; the daily subscription has not started."};
const testNote = () => el("p",{class:"test",role:"note"},"测试 TEST · "+TEST[lang]);
const SAMPLE = {zh:"推荐 · 样稿：已通过模型事实核查与来源上下文审核，尚待读者评价；不是正式发布的一期。",en:"Recommended · Sample: passed the model fact check and source-context review; awaiting reader feedback. Not an official edition."};
const sampleNote = () => el("p",{class:"sample",role:"note"},SAMPLE[lang]);
const PENDING = {zh:"待修订（",en:"Under revision ("};
const noticeBox = n => { const b = el("div",{class:"pending",role:"note"}); b.append(el("strong",{},PENDING[lang]+n.at+(lang==="zh"?"）":")")), el("p",{},n[lang])); return b; };
const rank = it => it.notice ? 2 : (it.sample ? 0 : 1);   // samples first; anything with a notice last and never recommended
let ITEM = null;
const BOOK_FILE = /^https?:\/\/(raw\.githubusercontent\.com|github\.com)\/.+\.(pdf|epub|mobi|azw3|txt|chm|djvu)(\?.*)?$/i;
const okUrl = x => typeof x === "string" && /^https?:\/\/[^\s]+$/.test(x) && !BOOK_FILE.test(x);   // never link a book file in a repository
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let lang = params.get("lang") || localStorage.getItem("hip-lang") || "zh";
if (!["zh","en"].includes(lang)) lang = "zh";
const el = (tag, attrs={}, text) => { const n=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) n.setAttribute(k,v); if (text!==undefined) n.textContent=text; return n; };

async function getJSON(rel){
  const r = await fetch(new URL(rel, location.href), {cache:"no-cache"});
  const ct = r.headers.get("content-type") || "";
  if (!r.ok) throw new Error("HTTP " + r.status + " · " + rel);
  if (!ct.includes("json")) throw new Error("不是 JSON（可能是站点回退到首页）/ not JSON: " + rel);
  return r.json();
}
function fail(err){ app.replaceChildren(el("div",{class:"error",role:"alert"},"内容加载失败 / Failed to load: " + err.message)); }

function renderList(index){
  document.title = "没事儿多读书"; document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  const wrap = el("div"); wrap.append(el("h1",{},"没事儿多读书"));
  const other = lang==="zh" ? "en" : "zh"; const u = new URL(location.href); u.searchParams.set("lang", other);
  const isTest = index.mode === "test";              // only the TEST preview index says so; production never shows the banner
  wrap.append(el("p",{class:"langs"}), ...(isTest ? [testNote()] : [])); wrap.querySelector(".langs").append(el("a",{href:u.search},other==="en"?"English":"中文"));
  // production lists published issues only: never a sample, a TEST or anything under revision
  const shown = isTest ? index.items : index.items.filter(i => !i.sample && !i.test && !i.notice);
  const f = el("div",{class:"filters",role:"group","aria-label":"类别"}); let active = params.get("cat") || "";
  const list = el("div");
  const draw = () => { list.replaceChildren();
    if (!shown.length) list.append(el("p",{class:"small"}, lang==="zh" ? "第一期即将发布。" : "The first story is coming soon."));
    for (const it of shown.filter(i => !active || i.category===active).sort((a,b) => rank(a)-rank(b))){
      const d = el("div",{class:"item"}); const a = el("a",{href:"?story="+encodeURIComponent(it.edition_id)+"&lang="+lang}, it.title[lang]);
      if (it.sample && !it.notice) d.append(sampleNote());
      if (it.notice) d.append(noticeBox(it.notice));
      d.append(a, el("div",{class:"meta"}, it.edition_date+" · "+CAT[it.category][lang==="zh"?0:1]+" · "+it.reading_minutes[lang]+" "+T[lang].min), el("div",{class:"small"}, it.dek[lang]));
      list.append(d);} };
  for (const [k,label] of [["",T[lang].all], ...Object.entries(CAT).map(([k,v])=>[k,v[lang==="zh"?0:1]])]){
    const b = el("button",{type:"button","aria-pressed":String(k===active)},label);
    b.onclick = () => { active=k; f.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); draw(); };
    f.append(b);
  }
  // search (2026-11-01): a static index of published issues, built with the site; searched here in the browser
  const S = {zh:{ph:"搜索标题、人物、书名、关键词",clear:"清除",label:"搜索故事",found:n=>"找到 "+n+" 篇",none:q=>"没有找到与“"+q+"”相关的故事。可以试试人物名、书名或更短的关键词。",fail:"搜索暂时不可用。"},
             en:{ph:"Search titles, people, books, keywords",clear:"Clear",label:"Search stories",found:n=>n+(n===1?" story":" stories"),none:q=>"No stories match “"+q+"”. Try a name, a book title or a shorter word.",fail:"Search is unavailable right now."}}[lang];
  const box = el("form",{class:"search",role:"search"}), inp = el("input",{type:"search",placeholder:S.ph,"aria-label":S.label,enterkeyhint:"search",autocomplete:"off"});
  const clr = el("button",{type:"button",class:"clear","aria-label":S.clear},S.clear), status = el("p",{class:"small",role:"status","aria-live":"polite"});
  box.append(inp, clr); box.onsubmit = ev => { ev.preventDefault(); inp.blur(); };
  let timer = null;
  const run = async () => {
    const q = inp.value.trim(); clr.hidden = !inp.value; const u2 = new URL(location.href);
    q ? u2.searchParams.set("q", q) : u2.searchParams.delete("q"); history.replaceState(null, "", u2);
    if (!q){ status.textContent = ""; f.hidden = false; draw(); return; }
    f.hidden = true;
    try {
      const hits = await searchStories(q);
      if (inp.value.trim() !== q) return;                   // a newer query is on its way
      status.textContent = hits.length ? S.found(hits.length) : S.none(q); list.replaceChildren();
      for (const h of hits){
        const d = el("div",{class:"item"}), t = h.it.title[lang] || h.it.title.zh;
        d.append(el("a",{href:"?story="+encodeURIComponent(h.it.id)+"&lang="+lang}, t),
                 el("div",{class:"meta"}, h.it.date+" · "+CAT[h.it.category][lang==="zh"?0:1]+(h.it.minutes ? " · "+h.it.minutes[lang]+" "+T[lang].min : "")),
                 el("div",{class:"small"}, h.snippet || h.it.dek[lang]));
        list.append(d);
      }
    } catch (err) { status.textContent = S.fail; }
  };
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 150); };
  inp.onkeydown = ev => { if (ev.key === "Escape"){ inp.value = ""; run(); } };
  clr.onclick = () => { inp.value = ""; run(); inp.focus(); };
  clr.hidden = true;
  wrap.append(box, status, f, list); app.replaceChildren(wrap); draw();
  if (params.get("q")){ inp.value = params.get("q"); run(); }
}

let SEARCH = null, SEARCH_TEXT = null;
const norm = x => (x || "").toLowerCase();
async function searchStories(q){
  SEARCH = SEARCH || getJSON("../data/history/search.json");
  SEARCH_TEXT = SEARCH_TEXT || getJSON("../data/history/search_text.json").catch(() => ({items:[]}));
  const [meta, body] = await Promise.all([SEARCH, SEARCH_TEXT]);
  const text = Object.fromEntries(body.items.map(t => [t.id, t]));
  const terms = norm(q).split(/\s+/).filter(Boolean), out = [];
  for (const it of meta.items){
    const tx = text[it.id] || {zh:"",en:""};
    const fields = [[10, it.title.zh+" "+it.title.en], [6, it.people.join(" ")+" "+it.tags.join(" ")+" "+it.books.join(" ")], [4, it.dek.zh+" "+it.dek.en], [1, tx.zh+" "+tx.en]];
    let score = 0, ok = true, onlyBody = true;
    for (const t of terms){
      const best = fields.find(([w, s]) => norm(s).includes(t));
      if (!best){ ok = false; break; }
      score += best[0]; if (best[0] > 1) onlyBody = false;
    }
    if (!ok) continue;
    let snippet = "";
    if (onlyBody){                                         // matched in the body only: show where
      const src = norm(tx[lang]).includes(terms[0]) ? tx[lang] : (lang==="zh" ? tx.en : tx.zh), i = norm(src).indexOf(terms[0]);
      snippet = (i > 30 ? "…" : "") + src.slice(Math.max(0, i - 30), i + terms[0].length + 50).replace(/\n/g, " ") + "…";
    }
    out.push({it, score, snippet});
  }
  return out.sort((a, b) => b.score - a.score || (a.it.date < b.it.date ? 1 : -1));
}

function currentPara(){                                 // the first paragraph whose bottom is still on screen
  for (const n of app.querySelectorAll("[data-k]")) if (n.getBoundingClientRect().bottom > 64) return n.dataset.k;
  return null;
}
function applyScale(){ app.style.setProperty("--scale", SCALES[scale]); }
function renderStory(o){
  document.documentElement.lang = lang==="zh" ? "zh-CN" : "en";
  document.title = ["没事儿多读书", /^\d{4}-\d{2}-\d{2}$/.test(o.edition_date||"") ? o.edition_date.replace(/-/g,".") : "", o.title[lang]].filter(Boolean).join("｜");
  const L = T[lang], w = el("article"), date = (o.edition_date||o.preview_date||"").replace(/-/g,".");
  w.append(el("a",{href:"./?lang="+lang,class:"back"},L.back));
  if (o.status === "test") w.append(testNote());
  if (o.status === "reader_sample" && !(ITEM && ITEM.notice)) w.append(sampleNote());
  if (ITEM && ITEM.notice && ITEM.notice.revision === o.revision) w.append(noticeBox(ITEM.notice));
  // column · date · category → title → dek → language and reading tools → body
  w.append(el("p",{class:"meta"}, BRAND[lang]+"｜"+date+" · "+CAT[o.category][lang==="zh"?0:1]+" · "+(lang==="zh"?"约 ":"~")+o.reading_minutes[lang]+" "+L.min));
  w.append(el("h1",{},o.title[lang]), el("p",{class:"dek"},o.dek[lang]));
  if (o.correction) {                                    // a correction is never folded away: dated, versioned, above the body
    const c = o.correction, box = el("div",{class:"corr",role:"note"});
    box.append(el("strong",{},(lang==="zh"?"更正（":"Correction (")+c.at+(lang==="zh"?"，第 ":", revision ")+o.revision+(lang==="zh"?" 版）":")")));
    box.append(el("p",{},c.note[lang]));
    if (c.previous) { const a = el("a",{href:"../"+c.previous.path},(lang==="zh"?"查看更正前的第 ":"Previous revision ")+c.previous.revision+(lang==="zh"?" 版":"")); box.append(el("p",{},a)); }
    w.append(box);
  }
  const tools = el("div",{class:"tools"}), tabs = el("div",{class:"tabs",role:"tablist","aria-label":"语言 / Language"});
  for (const [k,label] of [["zh","中文"],["en","English"]]){
    const b = el("button",{type:"button",role:"tab","aria-selected":String(k===lang),tabindex:k===lang?"0":"-1"},label);
    b.onclick = () => switchLang(k, o);
    b.onkeydown = ev => { if (ev.key==="ArrowRight"||ev.key==="ArrowLeft"){ ev.preventDefault(); switchLang(lang==="zh"?"en":"zh", o, true);} };
    tabs.append(b);
  }
  const fsz = el("div",{class:"fsz",role:"group","aria-label":L.fs}); fsz.append(el("span",{},L.fs));
  for (const [d,label,aria] of [[-1,"A−",lang==="zh"?"缩小字号":"Smaller text"],[1,"A+",lang==="zh"?"放大字号":"Larger text"]]){
    const b = el("button",{type:"button","aria-label":aria},label);
    b.onclick = () => { const k = currentPara(); scale = Math.min(SCALES.length-1, Math.max(0, scale+d)); localStorage.setItem("hip-fs", String(scale)); applyScale();
                        if (k) app.querySelector('[data-k="'+k+'"]')?.scrollIntoView({block:"start"}); };
    fsz.append(b);
  }
  tools.append(tabs, fsz); w.append(tools);
  const body = o.sections.filter(s => s.paras.length);
  if (body.length >= 4){                                 // contents only when it helps; folded, never over the text
    const toc = el("details",{class:"toc"}), ol = el("ol"); toc.append(el("summary",{},L.toc));
    for (const s of body){ const li = el("li"); li.append(el("a",{href:"#s-"+s.id},s.heading[lang])); ol.append(li); }
    toc.append(ol); w.append(toc);
  }
  for (const s of body){
    const sec = el("section",{id:"s-"+s.id}); sec.append(el("h2",{"data-k":s.id+".h"},s.heading[lang]));
    s.paras.forEach((p,i) => sec.append(el("p", Object.assign({"data-k":s.id+"."+i}, p.kind==="modern"?{class:"modern"}:{}), p[lang])));
    w.append(sec);
  }
  const r = o.reflection, q = el("section",{id:"s-reflection"});
  q.append(el("h2",{"data-k":"r.h"},L.q), el("p",{"data-k":"r.s"},r.scenario[lang]), el("p",{class:"question","data-k":"r.q"},r.question[lang]), el("p",{class:"small"},L.stop));
  const d = el("details",{id:"example"}); d.append(el("summary",{},L.ex));
  if (location.hash === "#example") d.open = true;     // deep link straight to the example answer
  for (const [k,lab] of [["assumptions",L.as],["steps",L.st],["alternative",L.alt]]){ const p=el("p"); p.append(el("strong",{},lab+(lang==="zh"?"：":": ")), document.createTextNode(r.example[k][lang])); d.append(p); }
  q.append(d); w.append(q);
  // end notes, folded: what the piece rests on, the notes on its material, and further reading.
  // Only verified http(s) URLs become links; an item without one is plain text (never "null").
  const notes = el("details",{id:"s-notes",class:"notes"});
  if (location.hash === "#notes") notes.open = true;
  notes.append(el("summary",{},L.notes), el("h3",{},L.src));
  const ol = el("ol",{class:"src"}); for (const s of o.sources){ const li=el("li",{},s.citation+" "); if (okUrl(s.url)){ const a=el("a",{href:s.url,rel:"noopener"},s.link_label||"link"); li.append(a);} ol.append(li);} notes.append(ol);
  if (o.uncertainty_note && o.uncertainty_note[lang]) notes.append(el("h3",{},L.unc), el("p",{},o.uncertainty_note[lang]));
  if (o.further_reading && o.further_reading.length){
    notes.append(el("h3",{},L.more)); const ul=el("ul",{class:"more"});
    for (const m of o.further_reading){ const li=el("li"); li.append(okUrl(m.url) ? el("a",{href:m.url,rel:"noopener"},m.title) : el("span",{},m.title), document.createTextNode(" — "+m.what[lang]+" ("+m.access[lang]+")")); ul.append(li);}
    notes.append(ul);
  }
  w.append(notes);
  app.replaceChildren(w); applyScale();
  if (location.hash === "#example") document.getElementById("example")?.scrollIntoView();
  else if (location.hash === "#notes") notes.scrollIntoView();
}
function switchLang(k, o, focus){
  const keep = currentPara(); lang = k; localStorage.setItem("hip-lang", k);
  const u = new URL(location.href); u.searchParams.set("lang", k); history.replaceState(null,"",u);
  renderStory(o);
  if (keep) app.querySelector('[data-k="'+keep+'"]')?.scrollIntoView({block:"start"});   // same paragraph, other language
  if (focus) app.querySelector('[role=tab][aria-selected=true]')?.focus();
}
(async () => {
  try {
    const index = await getJSON("../data/history/index.json");
    const id = params.get("story");
    if (!id) return renderList(index);
    const it = index.items.find(i => i.edition_id === id);
    if (!it) throw new Error("没有这篇 / not found: " + id);
    const o = await getJSON("../" + it.path);
    if (o.revision !== it.revision) throw new Error("版本不一致 / revision mismatch");
    ITEM = it; renderStory(o);
  } catch (err) { fail(err); }
})();
</script>
</body>
</html>
